<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fraud Checker</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background: linear-gradient(135deg, #4f46e5, #9333ea, #ec4899);
      min-height: 100vh;
    }
  </style>
</head>
<body class="flex items-center justify-center p-4 text-white">

  <div class="w-full max-w-3xl bg-white/10 backdrop-blur-lg rounded-2xl shadow-xl p-6">

    <!-- Header -->
    <h1 class="text-3xl font-bold text-center mb-4">
      🔍 Fraud Checker
    </h1>

    <!-- Input -->
    <div class="flex gap-2 mb-6">
      <input 
        id="phoneInput"
        type="text"
        placeholder="Enter phone number..."
        class="flex-1 px-4 py-2 rounded-lg text-black outline-none"
      />
      <button 
        onclick="checkFraud()"
        class="bg-indigo-600 hover:bg-indigo-700 px-4 py-2 rounded-lg font-semibold"
      >
        Check
      </button>
    </div>

    <!-- Result -->
    <div id="result" class="hidden space-y-4">

      <!-- Summary -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
        <div class="bg-white/20 p-4 rounded-xl">
          <p class="text-sm">Total Orders</p>
          <h2 id="totalOrders" class="text-xl font-bold"></h2>
        </div>

        <div class="bg-green-500/30 p-4 rounded-xl">
          <p class="text-sm">Success</p>
          <h2 id="successOrders" class="text-xl font-bold"></h2>
        </div>

        <div class="bg-red-500/30 p-4 rounded-xl">
          <p class="text-sm">Failed</p>
          <h2 id="failedOrders" class="text-xl font-bold"></h2>
        </div>

        <div class="bg-blue-500/30 p-4 rounded-xl">
          <p class="text-sm">Success Rate</p>
          <h2 id="successRate" class="text-xl font-bold"></h2>
        </div>
      </div>

      <!-- Risk -->
      <div class="bg-white/20 p-4 rounded-xl text-center">
        <p class="text-sm">Risk Status</p>
        <h2 id="riskStatus" class="text-2xl font-bold"></h2>
      </div>

      <!-- Courier Stats -->
      <div>
        <h3 class="text-lg font-semibold mb-2">Courier Stats</h3>
        <div id="couriers" class="grid md:grid-cols-2 gap-3"></div>
      </div>

    </div>

    <!-- Footer -->
    <p class="text-center text-sm mt-6 opacity-80">
      Powered by 
      <a href="https://fraudchecker.pro.bd" target="_blank" class="underline">
        fraudchecker.pro.bd
      </a>
    </p>

  </div>

  <script>
    async function checkFraud() {
      const phone = document.getElementById("phoneInput").value;
      if (!phone) return alert("Enter phone number");

      const url = `http://fraudchecker.pro.bd/api/check?phone=${phone}`;

      try {
        const res = await fetch(url);
        const data = await res.json();

        document.getElementById("result").classList.remove("hidden");

        // Summary
        document.getElementById("totalOrders").innerText = data.totalOrders;
        document.getElementById("successOrders").innerText = data.successOrders;
        document.getElementById("failedOrders").innerText = data.failedOrders;
        document.getElementById("successRate").innerText = data.successRate + "%";

        // Risk
        const riskEl = document.getElementById("riskStatus");
        riskEl.innerText = data.riskStatus;
        riskEl.className = `text-2xl font-bold ${data.riskColor}`;

        // Courier Stats
        const container = document.getElementById("couriers");
        container.innerHTML = "";

        data.courierStats.forEach(c => {
          const card = `
            <div class="bg-white/20 p-3 rounded-xl">
              <h4 class="font-semibold">${c.displayName}</h4>
              <p>Total: ${c.total}</p>
              <p class="text-green-300">Success: ${c.success}</p>
              <p class="text-red-300">Failed: ${c.failed}</p>
            </div>
          `;
          container.innerHTML += card;
        });

      } catch (err) {
        alert("Error fetching data");
      }
    }
  </script>

</body>
</html>
