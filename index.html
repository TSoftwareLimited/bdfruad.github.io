<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Fraud Checker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top: 3px solid #3b82f6;
            width: 24px;
            height: 24px;
            -webkit-animation: spin 1s linear infinite; /* Safari */
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-gray-900 via-indigo-950 to-black flex flex-col items-center justify-center p-4 font-sans antialiased text-gray-100">

    <main class="glass-card rounded-3xl p-8 w-full max-w-lg shadow-2xl relative overflow-hidden">
        
        <div class="absolute top-0 left-0 w-32 h-32 bg-blue-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>
        <div class="absolute bottom-0 right-0 w-32 h-32 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>

        <div class="relative z-10">
            <div class="text-center mb-8">
                <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400 mb-2">
                    Fraud Checker
                </h1>
                <p class="text-gray-400 text-sm">Enter a phone number to verify its status</p>
            </div>

            <form id="checkForm" class="space-y-5">
                <div>
                    <label for="phoneInput" class="block text-sm font-medium text-gray-300 mb-2">Phone Number</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                            </svg>
                        </div>
                        <input 
                            type="text" 
                            id="phoneInput" 
                            placeholder="e.g., 01310886225" 
                            required
                            class="w-full pl-12 pr-4 py-3 bg-white/5 border border-white/10 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent text-white placeholder-gray-500 transition-all"
                        >
                    </div>
                </div>

                <button 
                    type="submit" 
                    class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg transform hover:-translate-y-0.5 transition-all duration-200 flex items-center justify-center space-x-2"
                >
                    <span>Check Status</span>
                </button>
            </form>

            <div id="loading" class="hidden mt-6 flex flex-col items-center justify-center text-gray-400 space-y-3">
                <div class="spinner"></div>
                <span class="text-sm animate-pulse">Analyzing phone number...</span>
            </div>

            <div id="resultContainer" class="hidden mt-6">
                <h3 class="text-sm font-semibold text-gray-300 mb-2">Analysis Result:</h3>
                <div class="bg-black/40 border border-white/10 rounded-xl p-4 overflow-x-auto">
                    <pre id="resultData" class="text-xs text-green-400 font-mono"></pre>
                </div>
            </div>

            <div id="errorContainer" class="hidden mt-6 bg-red-500/10 border border-red-500/20 rounded-xl p-4">
                <p id="errorMessage" class="text-sm text-red-400 text-center"></p>
            </div>
        </div>
    </main>

    <footer class="mt-8 text-center">
        <p class="text-sm text-gray-500 tracking-wide">
            Powered by 
            <a href="https://fraudchecker.pro.bd" target="_blank" rel="noopener noreferrer" class="font-semibold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400 hover:from-blue-300 hover:to-purple-300 transition-colors">
                fraudchecker.pro.bd
            </a>
        </p>
    </footer>

    <script>
        document.getElementById('checkForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const phone = document.getElementById('phoneInput').value.trim();
            const loading = document.getElementById('loading');
            const resultContainer = document.getElementById('resultContainer');
            const resultData = document.getElementById('resultData');
            const errorContainer = document.getElementById('errorContainer');
            const errorMessage = document.getElementById('errorMessage');

            if (!phone) return;

            // Reset UI
            resultContainer.classList.add('hidden');
            errorContainer.classList.add('hidden');
            loading.classList.remove('hidden');

            try {
                // Fetch data from the provided API
                const response = await fetch(`https://fraudchecker.pro.bd/api/check?phone=${encodeURIComponent(phone)}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();

                // Display success result
                resultData.textContent = JSON.stringify(data, null, 2);
                resultContainer.classList.remove('hidden');

            } catch (error) {
                console.error("Fetch error:", error);
                
                // Check if it might be a CORS error
                if(error.message.includes('Failed to fetch')) {
                    errorMessage.innerHTML = "Connection failed. The API might have <b>CORS (Cross-Origin Resource Sharing)</b> restrictions preventing browser access, or your internet is down.";
                } else {
                    errorMessage.textContent = "Error: " + error.message;
                }
                
                errorContainer.classList.remove('hidden');
            } finally {
                loading.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
