<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Fraud Checker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top: 3px solid #3b82f6;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .fade-in {
            animation: fadeIn 0.4s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-gray-900 via-indigo-950 to-black flex flex-col items-center justify-center p-4 font-sans antialiased text-gray-100">

    <main class="glass-card rounded-3xl p-8 w-full max-w-lg shadow-2xl relative overflow-hidden">
        
        <div class="absolute top-0 left-0 w-32 h-32 bg-blue-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 pointer-events-none"></div>
        <div class="absolute bottom-0 right-0 w-32 h-32 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 pointer-events-none"></div>

        <div class="relative z-10">
            <div class="text-center mb-8">
                <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400 mb-2">
                    Fraud Checker
                </h1>
                <p class="text-gray-400 text-sm">Enter a phone number to verify its status</p>
            </div>

            <form id="checkForm" class="space-y-5">
                <div>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                            </svg>
                        </div>
                        <input 
                            type="text" 
                            id="phoneInput" 
                            placeholder="e.g., 01310886225" 
                            required
                            class="w-full pl-12 pr-4 py-3 bg-white/5 border border-white/10 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent text-white placeholder-gray-500 transition-all font-mono"
                        >
                    </div>
                </div>

                <button 
                    type="submit" 
                    class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg transform hover:-translate-y-0.5 transition-all duration-200 flex items-center justify-center space-x-2"
                >
                    <span>Check Status</span>
                </button>
            </form>

            <div id="loading" class="hidden mt-8 flex flex-col items-center justify-center text-gray-400 space-y-3">
                <div class="spinner"></div>
                <span class="text-sm animate-pulse">Analyzing history...</span>
            </div>

            <div id="resultDashboard" class="hidden mt-8 space-y-5 fade-in">
                <div class="flex justify-between items-end border-b border-white/10 pb-3">
                    <div>
                        <p class="text-xs text-gray-500 uppercase tracking-wider mb-1">Phone Number</p>
                        <h2 class="text-xl font-mono font-bold tracking-wider text-gray-100" id="rPhone"></h2>
                    </div>
                    <div class="text-right">
                        <span id="rRisk" class="px-3 py-1.5 rounded-full text-xs font-bold bg-white/10 shadow-inner"></span>
                    </div>
                </div>
                
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-white/5 p-4 rounded-xl border border-white/10 text-center shadow-lg">
                        <p class="text-[10px] text-gray-400 uppercase tracking-widest mb-1">Total Orders</p>
                        <p class="text-3xl font-bold text-blue-400" id="rTotal"></p>
                    </div>
                    <div class="bg-white/5 p-4 rounded-xl border border-white/10 text-center shadow-lg">
                        <p class="text-[10px] text-gray-400 uppercase tracking-widest mb-1">Success Rate</p>
                        <p class="text-3xl font-bold text-purple-400" id="rRate"></p>
                    </div>
                    <div class="bg-green-500/5 p-3 rounded-xl border border-green-500/20 text-center flex justify-between items-center">
                        <p class="text-xs text-green-400/80 uppercase tracking-wider">Success</p>
                        <p class="text-xl font-semibold text-green-400" id="rSuccess"></p>
                    </div>
                    <div class="bg-red-500/5 p-3 rounded-xl border border-red-500/20 text-center flex justify-between items-center">
                        <p class="text-xs text-red-400/80 uppercase tracking-wider">Failed</p>
                        <p class="text-xl font-semibold text-red-400" id="rFailed"></p>
                    </div>
                </div>

                <div class="mt-2 bg-black/30 p-4 rounded-xl border border-white/5 shadow-inner">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-xs text-gray-400 uppercase tracking-wider">Courier Breakdown</h3>
                        <span class="text-[10px] text-gray-500" id="rSource"></span>
                    </div>
                    <div id="rCouriers" class="space-y-3">
                        </div>
                </div>
            </div>

            <div id="errorContainer" class="hidden mt-6 bg-red-500/10 border border-red-500/20 rounded-xl p-4 fade-in">
                <p id="errorMessage" class="text-sm text-red-400 text-center"></p>
            </div>
        </div>
    </main>

    <footer class="mt-8 text-center">
        <p class="text-sm text-gray-500 tracking-wide">
            Powered by 
            <a href="https://fraudchecker.pro.bd" target="_blank" rel="noopener noreferrer" class="font-semibold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400 hover:from-blue-300 hover:to-purple-300 transition-colors">
                fraudchecker.pro.bd
            </a>
        </p>
    </footer>

    <script>
        document.getElementById('checkForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const phone = document.getElementById('phoneInput').value.trim();
            const loading = document.getElementById('loading');
            const resultDashboard = document.getElementById('resultDashboard');
            const errorContainer = document.getElementById('errorContainer');
            const errorMessage = document.getElementById('errorMessage');

            if (!phone) return;

            // Reset UI States
            resultDashboard.classList.add('hidden');
            errorContainer.classList.add('hidden');
            loading.classList.remove('hidden');

            try {
                // Fetch data from the API
                const response = await fetch(`https://fraudchecker.pro.bd/api/check?phone=${encodeURIComponent(phone)}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();

                // Populate Dashboard with API Data
                document.getElementById('rPhone').textContent = data.phone;
                
                // Handle Risk Badge mapping the API's Tailwind color class dynamically
                const riskBadge = document.getElementById('rRisk');
                riskBadge.textContent = data.riskStatus;
                // Reset classes in case of multiple searches, then apply the new color class provided by API
                riskBadge.className = `px-3 py-1.5 rounded-full text-xs font-bold bg-white/10 shadow-inner ${data.riskColor}`;
                
                document.getElementById('rTotal').textContent = data.totalOrders;
                document.getElementById('rRate').textContent = `${data.successRate}%`;
                document.getElementById('rSuccess').textContent = data.successOrders;
                document.getElementById('rFailed').textContent = data.failedOrders;
                document.getElementById('rSource').textContent = data.dataSource;

                // Render Courier Stats (Only showing couriers that have actual data/history)
                const courierContainer = document.getElementById('rCouriers');
                courierContainer.innerHTML = ''; // Clear previous
                
                const activeCouriers = data.courierStats.filter(c => c.total > 0);
                
                if(activeCouriers.length === 0) {
                    courierContainer.innerHTML = '<p class="text-xs text-gray-500 text-center py-2">No specific courier history found.</p>';
                } else {
                    activeCouriers.forEach(courier => {
                        const html = `
                            <div class="flex justify-between items-center text-sm">
                                <span class="text-gray-300 font-medium">${courier.displayName}</span>
                                <div class="flex space-x-3 text-xs">
                                    <span class="text-blue-400" title="Total">${courier.total}</span>
                                    <span class="text-gray-600">|</span>
                                    <span class="text-green-400" title="Success">${courier.success}</span>
                                    <span class="text-gray-600">|</span>
                                    <span class="text-red-400" title="Failed">${courier.failed}</span>
                                </div>
                            </div>
                            <div class="w-full bg-white/5 rounded-full h-1 mt-1">
                                <div class="bg-gradient-to-r from-green-500 to-red-500 h-1 rounded-full" style="width: ${(courier.success / courier.total) * 100}%"></div>
                            </div>
                        `;
                        courierContainer.insertAdjacentHTML('beforeend', html);
                    });
                }

                // Show Dashboard
                resultDashboard.classList.remove('hidden');

            } catch (error) {
                console.error("Fetch error:", error);
                if(error.message.includes('Failed to fetch')) {
                    errorMessage.innerHTML = "Connection failed. The API might have <b>CORS</b> restrictions preventing browser access.";
                } else {
                    errorMessage.textContent = "Error: " + error.message;
                }
                errorContainer.classList.remove('hidden');
            } finally {
                loading.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
