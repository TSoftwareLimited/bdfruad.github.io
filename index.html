<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fraud Checker Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top: 3px solid #6366f1;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen bg-slate-950 text-white flex flex-col items-center justify-center p-4">

    <div class="glass-card p-8 rounded-3xl w-full max-w-md shadow-2xl">
        <h1 class="text-3xl font-bold mb-2 bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent text-center">
            Fraud Checker
        </h1>
        <p class="text-slate-400 text-center text-sm mb-8">Enter phone number to check reliability</p>

        <form id="fraudForm" class="space-y-4">
            <input 
                type="text" 
                id="phone" 
                placeholder="01310886225" 
                required
                class="w-full px-5 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all"
            >
            <button 
                type="submit" 
                class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 font-bold rounded-xl transition-colors shadow-lg shadow-indigo-500/20"
            >
                Check Now
            </button>
        </form>

        <div id="loading" class="hidden mt-6 flex flex-col items-center gap-2">
            <div class="spinner"></div>
            <span class="text-xs text-slate-500">Fetching data...</span>
        </div>

        <div id="result" class="hidden mt-6 p-4 bg-black/40 rounded-xl border border-white/5">
            <pre id="jsonOutput" class="text-[10px] text-emerald-400 font-mono overflow-x-auto"></pre>
        </div>

        <div id="error" class="hidden mt-6 p-4 bg-red-500/10 border border-red-500/20 rounded-xl text-red-400 text-sm text-center"></div>
    </div>

    <footer class="mt-8 text-slate-600 text-xs">
        Powered by <a href="https://fraudchecker.pro.bd" class="hover:text-indigo-400">fraudchecker.pro.bd</a>
    </footer>

    <script>
        document.getElementById('fraudForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const phone = document.getElementById('phone').value;
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            const errorDiv = document.getElementById('error');
            const jsonOutput = document.getElementById('jsonOutput');

            // Reset UI
            loading.classList.remove('hidden');
            result.classList.add('hidden');
            errorDiv.classList.add('hidden');

            try {
                // Using GET method via CORS Proxy
                const targetUrl = `https://fraudchecker.pro.bd/api/check?phone=${phone}`;
                const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;

                const response = await fetch(proxyUrl, {
                    method: 'GET', // Explicitly using GET method
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (!response.ok) throw new Error('Failed to fetch data from API');

                const data = await response.json();
                
                // Show Result
                jsonOutput.textContent = JSON.stringify(data, null, 2);
                result.classList.remove('hidden');

            } catch (err) {
                errorDiv.textContent = "Error: Could not connect to the service. Please try again.";
                errorDiv.classList.remove('hidden');
            } finally {
                loading.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
